<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- Visor Goggles Shape -->
  <path d="M 96 210 C 96 170, 210 160, 256 185 C 302 160, 416 170, 416 210 C 426 290, 340 330, 280 320 C 260 316, 252 300, 256 300 C 260 300, 252 316, 232 320 C 172 330, 86 290, 96 210 Z" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="6" filter="url(#glow)" />
  <!-- Iris / Spatial Pupil Dot -->
  <circle cx="180" cy="240" r="28" fill="#ffffff" opacity="0.9"/>
  <circle cx="332" cy="240" r="28" fill="#ffffff" opacity="0.9"/>
</svg>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación a Transmisión — visionOS Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body { background-color: #050508; color: #fff; font-family: system-ui, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-4">
    <div class="glass max-w-md w-full p-8 rounded-3xl text-center space-y-6 shadow-2xl">
        <div class="w-16 h-16 bg-sky-500/20 text-sky-400 rounded-2xl flex items-center justify-center text-3xl mx-auto border border-sky-500/30">
            <i class="fa-solid fa-eye"></i>
        </div>
        <div class="space-y-2">
            <h1 class="text-xl font-bold">Invitación de Espacio Virtual</h1>
            <p class="text-xs text-white/70">¿Estás seguro de que quieres ver lo que hace el usuario en su simulador visionOS?</p>
            <p class="text-xs text-sky-300 font-mono mt-2">Código: <span id="session-code">...</span></p>
        </div>
        <div class="flex gap-3">
            <button onclick="window.location.href='../../'" class="flex-1 py-3 bg-white/10 hover:bg-white/20 rounded-xl text-xs font-semibold transition">No, salir</button>
            <button id="accept-btn" class="flex-1 py-3 bg-sky-500 hover:bg-sky-400 text-black rounded-xl text-xs font-bold transition">Sí, ver ahora</button>
        </div>
    </div>

    <script>
        const parts = window.location.pathname.split('/').filter(Boolean);
        const code = parts[parts.length - 1] && parts[parts.length - 1] !== 'view' ? parts[parts.length - 1] : '96bb9ezw';
        document.getElementById('session-code').textContent = code;
        document.getElementById('accept-btn').onclick = () => {
            window.location.href = `../../view/${code}`;
        };
    </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Glowing Orbs -->
  <circle cx="200" cy="150" r="250" fill="#0284c7" opacity="0.18" filter="blur(80px)"/>
  <circle cx="1000" cy="480" r="280" fill="#7e22ce" opacity="0.2" filter="blur(90px)"/>

  <!-- Glass Card Window -->
  <rect x="100" y="80" width="1000" height="470" rx="36" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>

  <!-- Header dots -->
  <circle cx="150" cy="130" r="8" fill="#f43f5e"/>
  <circle cx="175" cy="130" r="8" fill="#fbbf24"/>
  <circle cx="200" cy="130" r="8" fill="#34d399"/>

  <!-- Title & Text -->
  <text x="600" y="240" font-family="-apple-system, sans-serif" font-weight="800" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    visionOS Web Simulator
  </text>
  
  <text x="600" y="300" font-family="-apple-system, sans-serif" font-weight="600" font-size="24" fill="url(#accent)" text-anchor="middle" letter-spacing="2">
    APPLE VISION PRO EXPERIENCE IN YOUR BROWSER
  </text>

  <!-- Feature Badges -->
  <g transform="translate(230, 360)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="60" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="110" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">🖐️ Hand Tracking</text>

    <!-- Badge 2 -->
    <rect x="250" y="0" width="240" height="60" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="370" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">📱 Android Controller</text>

    <!-- Badge 3 -->
    <rect x="510" y="0" width="230" height="60" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="625" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c084fc" text-anchor="middle">👾 Twitch IRC Chat</text>
  </g>

  <!-- Subtitle Footer -->
  <text x="600" y="495" font-family="monospace" font-size="15" fill="rgba(255,255,255,0.5)" text-anchor="middle">
    https://visionos-sim.vercel.app/ • Open Source &amp; Free
  </text>
</svg>